<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Passwort zurücksetzen · LeoLan Dashboard</title>
  <style>
    :root{--accent:#f5a623;--text:#fff;--muted:rgba(255,255,255,.72);--danger:#ff6b6b;--success:#43d98c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top right,rgba(245,166,35,.18),transparent 28%),radial-gradient(circle at top left,rgba(67,97,157,.25),transparent 30%),linear-gradient(160deg,#09101f,#101a2f 48%,#0d1527)}
    .card{width:min(470px,100%);padding:32px;border-radius:28px;background:linear-gradient(180deg,rgba(26,39,68,.97),rgba(14,24,44,.97));border:1px solid rgba(245,166,35,.24);box-shadow:0 24px 60px rgba(0,0,0,.38)}
    .badge{width:70px;height:70px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-size:32px;background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.32)}
    h1{margin:0 0 10px;text-align:center;font-size:clamp(1.65rem,5vw,2.2rem)}p{margin:0 0 22px;text-align:center;color:var(--muted);line-height:1.55}
    form{display:grid;gap:12px}label{font-size:.88rem;font-weight:700;color:#f5d69b}input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.06);color:var(--text);font-size:1rem;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(245,166,35,.12)}
    button{border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,#f5a623,#ffbe4d);color:#17233f;font-weight:800;font-size:1rem;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .message{min-height:22px;margin-top:14px;text-align:center;font-weight:650;line-height:1.45}.message.error{color:var(--danger)}.message.success{color:var(--success)}
    .back{display:block;margin-top:18px;text-align:center;color:#ffd487;font-weight:700;text-decoration:none}.back:hover{text-decoration:underline}.hint{font-size:.82rem;text-align:left;margin:-2px 0 4px;color:var(--muted)}
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">🔐</div>
    <section id="requestSection">
      <h1>Passwort vergessen?</h1>
      <p>Gib deine Dashboard-E-Mail ein. Falls ein Konto existiert, senden wir dir einen einmal verwendbaren Link.</p>
      <form id="requestForm">
        <label for="requestEmail">E-Mail-Adresse</label>
        <input id="requestEmail" type="email" autocomplete="email" required placeholder="name@leolan.net" />
        <button id="requestButton" type="submit">Reset-Link senden</button>
      </form>
      <div id="requestMessage" class="message" aria-live="polite"></div>
    </section>
    <section id="confirmSection" class="hidden">
      <h1>Neues Passwort</h1>
      <p>Lege jetzt ein neues Passwort für dein LeoLan Dashboard fest.</p>
      <form id="confirmForm">
        <label for="newPassword">Neues Passwort</label>
        <input id="newPassword" type="password" autocomplete="new-password" minlength="12" required />
        <div class="hint">Mindestens 12 Zeichen, Groß- und Kleinbuchstaben sowie eine Zahl.</div>
        <label for="confirmPassword">Passwort wiederholen</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required />
        <button id="confirmButton" type="submit">Passwort speichern</button>
      </form>
      <div id="confirmMessage" class="message" aria-live="polite"></div>
    </section>
    <a class="back" href="/dashboard.html">← Zurück zur Anmeldung</a>
  </main>
  <script>
    const REQUEST_URL='https://n8n.leolan.net/webhook/dashboard-password-reset-request';
    const CONFIRM_URL='https://n8n.leolan.net/webhook/dashboard-password-reset-confirm';
    const params=new URLSearchParams(location.search),token=params.get('token')||'',email=params.get('email')||'';
    const requestSection=document.getElementById('requestSection'),confirmSection=document.getElementById('confirmSection');
    const requestForm=document.getElementById('requestForm'),confirmForm=document.getElementById('confirmForm');
    if(token&&email){requestSection.classList.add('hidden');confirmSection.classList.remove('hidden');}
    async function postForm(url,data){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams(data)});const payload=await response.json().catch(()=>({}));if(!response.ok||payload.success===false)throw new Error(payload.error||'Die Anfrage konnte nicht verarbeitet werden.');return payload;}
    requestForm.addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('requestButton'),message=document.getElementById('requestMessage');button.disabled=true;message.className='message';message.textContent='Link wird vorbereitet…';try{const result=await postForm(REQUEST_URL,{email:document.getElementById('requestEmail').value.trim()});message.className='message success';message.textContent=result.message||'Falls ein Konto existiert, wurde ein Reset-Link versendet.';requestForm.reset();}catch(error){message.className='message error';message.textContent=error instanceof TypeError?'Der Anmeldedienst ist gerade nicht erreichbar. Bitte versuche es erneut.':error.message;}finally{button.disabled=false;}});
    confirmForm.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('newPassword').value,repeated=document.getElementById('confirmPassword').value,button=document.getElementById('confirmButton'),message=document.getElementById('confirmMessage');if(password!==repeated){message.className='message error';message.textContent='Die Passwörter stimmen nicht überein.';return;}button.disabled=true;message.className='message';message.textContent='Passwort wird sicher gespeichert…';try{await postForm(CONFIRM_URL,{email,token,password});message.className='message success';message.textContent='Passwort erfolgreich geändert. Du kannst dich jetzt anmelden.';confirmForm.reset();button.textContent='Gespeichert';setTimeout(()=>location.href='/dashboard.html',1800);}catch(error){message.className='message error';message.textContent=error instanceof TypeError?'Der Anmeldedienst ist gerade nicht erreichbar. Bitte versuche es erneut.':error.message;button.disabled=false;}});
  </script>
</body>
</html>
