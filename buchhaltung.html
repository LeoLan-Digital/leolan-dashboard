    --purple: #bf5af2;
    --teal: #5ac8fa;
    --accent: #0a84ff;
    --sidebar-w: 240px;
    /* backward-compat aliases for inline styles */
    --border: rgba(255,255,255,0.1);
    --text-muted: rgba(255,255,255,0.45);
    --text-dim: rgba(255,255,255,0.55);
    --accent2: #5ac8fa;
    --surface2: #2c2c2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Header ─────────────────────────────────────────── */
  header {
    background: rgba(28,28,30,0.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--separator);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    z-index: 200;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 28px; height: 28px;
    background: var(--blue);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .logo h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .logo span {
    color: var(--text-secondary);
    font-size: 12px;
    display: block;
    font-weight: 400;
    letter-spacing: 0;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .header-badge {
    background: var(--surface2);
    border-radius: 12px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .header-menu-btn {
    display: none;
    background: none; border: none;
    color: var(--text-secondary);
    cursor: pointer; font-size: 18px; padding: 4px 8px;
  }
  @media(max-width:768px) { .header-menu-btn { display: block; } }

  /* ── App Layout ─────────────────────────────────────── */
  .app-layout {
    display: flex;
    margin-top: 52px;
    min-height: calc(100vh - 52px);
  }

  /* ── Sidebar ─────────────────────────────────────────── */
  .sidebar {
    width: var(--sidebar-w);
    min-width: var(--sidebar-w);
    background: var(--bg-elevated);
    border-right: 1px solid var(--separator);
    position: fixed;
    top: 52px;
    left: 0;
    bottom: 0;
    overflow-y: auto;
    z-index: 150;
    transition: transform 0.2s ease;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.1) transparent;
  }
  .sidebar.collapsed { transform: translateX(-100%); }
  @media(max-width:768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0 !important; }
  }
  .sidebar-inner { padding: 10px 8px 32px; }

  /* Sidebar sections */
  .sidebar-section { margin-bottom: 4px; }
  .sidebar-section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px;
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-tertiary);
    cursor: pointer; user-select: none;
    transition: color 0.15s;
    border-radius: 6px;
  }
  .sidebar-section-header:hover { color: var(--text-secondary); }
  .chevron { font-size: 9px; transition: transform 0.2s; opacity: 0.5; }
  .sidebar-section.collapsed .chevron { transform: rotate(-90deg); }
  .sidebar-section.collapsed .sidebar-sub-body { display: none; }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    height: 36px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
    margin-bottom: 1px;
  }
  .sidebar-item:hover {
    color: var(--text);
    background: rgba(255,255,255,0.05);
  }
  .sidebar-item.active {
    color: var(--blue);
    background: rgba(10,132,255,0.12);
    font-weight: 500;
  }

  .sidebar-sub-body { }
  .sidebar-sub-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 0 28px;
    height: 34px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-secondary);
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s ease, color 0.15s ease;
    user-select: none;
    margin-bottom: 1px;
  }
  .sidebar-sub-item:hover {
    color: var(--text);
    background: rgba(255,255,255,0.05);
  }
  .sidebar-sub-item.active {
    color: var(--blue);
    background: rgba(10,132,255,0.12);
    font-weight: 500;
  }
  .sidebar-badge {
    margin-left: auto;
    background: rgba(255,69,58,0.2);
    color: var(--red);
    border-radius: 10px;
    padding: 1px 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .sidebar-divider {
    height: 1px;
    background: var(--separator);
    margin: 6px 0;
  }

  /* ── Main Content ─────────────────────────────────────── */
  .main-content {
    flex: 1;
    margin-left: var(--sidebar-w);
    min-width: 0;
    min-height: calc(100vh - 52px);
    background: var(--bg);
  }
  main { padding: 32px; max-width: 1500px; }
  .tab-content { display: none !important; animation: none; }
  .tab-content.active { display: block !important; animation: tabFadeIn 0.2s ease; }

  @keyframes tabFadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── KPI Cards ───────────────────────────────────────── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
  }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; border-radius: 12px 12px 0 0; }
  .kpi-card.green::before  { background: var(--green); }
  .kpi-card.red::before    { background: var(--red); }
  .kpi-card.orange::before { background: var(--orange); }
  .kpi-card.purple::before { background: var(--purple); }
  .kpi-label {
    color: var(--text-tertiary);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .kpi-value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .kpi-value.red    { color: var(--red); }
  .kpi-value.green  { color: var(--green); }
  .kpi-value.orange { color: var(--orange); }
  .kpi-sub {
    color: var(--text-tertiary);
    font-size: 12px;
    margin-top: 4px;
  }

  /* ── Chart ───────────────────────────────────────────── */
  .chart-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .chart-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    margin-bottom: 16px;
  }
  .chart-container { display: flex; align-items: flex-end; gap: 10px; height: 140px; padding-bottom: 22px; position: relative; border-bottom: 1px solid var(--separator); }
  .chart-month { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
  .chart-bars { display: flex; gap: 3px; align-items: flex-end; width: 100%; justify-content: center; }
  .bar { width: 12px; border-radius: 3px 3px 0 0; min-height: 2px; transition: all 0.3s ease; }
  .bar.income  { background: var(--green); opacity: 0.9; }
  .bar.expense { background: var(--red); opacity: 0.8; }
  .chart-label { font-size: 11px; color: var(--text-tertiary); margin-top: 5px; }
  .chart-legend { display: flex; gap: 16px; margin-top: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }
  .legend-dot.income  { background: var(--green); }
  .legend-dot.expense { background: var(--red); }

  /* ── Page Header ─────────────────────────────────────── */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
  }
  .page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* ── Buttons ─────────────────────────────────────────── */
  .btn {
    background: var(--blue);
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 16px;
    transition: opacity 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { opacity: 0.88; }
  .btn:active { transform: scale(0.98); opacity: 0.9; }
  .btn-outline {
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--text);
  }
  .btn-outline:hover { background: rgba(255,255,255,0.14); opacity: 1; }
  .btn-sm  { padding: 7px 12px; font-size: 13px; }
  .btn-xs  { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
  .btn-green  { background: var(--green); color: #000; }
  .btn-green:hover { opacity: 0.85; }
  .btn-red {
    background: rgba(255,69,58,0.12);
    border: none;
    color: var(--red);
  }
  .btn-red:hover { background: rgba(255,69,58,0.18); opacity: 1; }
  .btn-orange { background: var(--orange); color: #000; }
  .btn-orange:hover { opacity: 0.85; color: #000; }

  /* ── Tables ──────────────────────────────────────────── */
  .table-wrap {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  thead { background: rgba(255,255,255,0.03); }
  th {
    padding: 10px 16px;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-tertiary);
    font-weight: 500;
    white-space: nowrap;
    border-bottom: 1px solid var(--separator);
  }
  th:last-child, td:last-child { text-align: right; }
  td {
    padding: 12px 16px;
    border-bottom: 1px solid var(--separator);
    vertical-align: middle;
    font-size: 14px;
    color: var(--text);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255,255,255,0.04); }
  .amount-positive { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .amount-negative { color: var(--red);   font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .amount-neutral  { color: var(--text-secondary); font-variant-numeric: tabular-nums; text-align: right; }

  /* ── Badges ──────────────────────────────────────────── */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .badge-green  { background: rgba(48,209,88,0.15);  color: var(--green); }
  .badge-yellow { background: rgba(255,214,10,0.15); color: var(--yellow); }
  .badge-blue   { background: rgba(10,132,255,0.15); color: var(--blue); }
  .badge-red    { background: rgba(255,69,58,0.15);  color: var(--red); }
  .badge-gray   { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
  .badge-purple { background: rgba(191,90,242,0.15); color: var(--purple); }
  .badge-orange { background: rgba(255,159,10,0.15); color: var(--orange); }
  .badge-konto  { background: rgba(10,132,255,0.12); color: var(--teal); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; }
  .badge-stk-vst19 { background: rgba(48,209,88,0.12);  color: #66d47e; }
  .badge-stk-vst7  { background: rgba(255,214,10,0.12); color: var(--yellow); }
  .badge-stk-vst0  { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
  .badge-stk-frei  { background: rgba(255,69,58,0.1);   color: #ff7b73; }

  /* ── Status Select ───────────────────────────────────── */
  .status-select {
    background: transparent;
    border: 1px solid var(--separator);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  .status-select:focus { border-color: var(--blue); }
  .status-select.s-bezahlt    { border-color: rgba(48,209,88,0.4);  color: var(--green);  background: rgba(48,209,88,0.1); }
  .status-select.s-offen      { border-color: rgba(255,214,10,0.4); color: var(--yellow); background: rgba(255,214,10,0.08); }
  .status-select.s-überfällig,
  .status-select.s-uberfaellig{ border-color: rgba(255,69,58,0.4); color: var(--red);   background: rgba(255,69,58,0.08); }
  .status-select.s-storniert  { border-color: rgba(255,255,255,0.15); color: var(--text-secondary); background: rgba(255,255,255,0.05); }

  /* ── Inline Editable ─────────────────────────────────── */
  .editable-cell {
    cursor: pointer;
    border-radius: 5px;
    padding: 2px 5px;
    margin: -2px -5px;
    transition: background 0.15s;
    position: relative;
  }
  .editable-cell:hover { background: rgba(10,132,255,0.1); outline: 1px dashed rgba(10,132,255,0.5); }
  .editable-cell:hover::after { content: ' ✎'; font-size: 10px; color: var(--blue); opacity: 0.7; }
  .editable-cell[contenteditable="true"] {
    background: var(--surface2);
    outline: 2px solid var(--blue);
    padding: 3px 6px; margin: -3px -6px;
    border-radius: 6px; min-width: 60px;
    white-space: nowrap; cursor: text;
  }
  .editable-cell[contenteditable="true"]:hover::after { display: none; }

  /* ── Actions ─────────────────────────────────────────── */
  .actions-cell { display: flex; gap: 4px; align-items: center; white-space: nowrap; justify-content: flex-end; }

  /* ── Modal ───────────────────────────────────────────── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 28px 32px;
    width: 580px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--text-tertiary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 500;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 12px;
    transition: border-color 0.15s;
    outline: none;
    font-family: inherit;
  }
  .form-group textarea { resize: vertical; min-height: 65px; }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--blue); }
  .form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; }
  .form-hint { font-size: 12px; color: var(--text-tertiary); margin-top: -10px; margin-bottom: 12px; }

  /* ── EÜR ─────────────────────────────────────────────── */
  .eur-container {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 28px;
  }
  .eur-header { text-align: center; margin-bottom: 28px; }
  .eur-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
  .eur-header p { color: var(--text-secondary); margin-top: 6px; font-size: 14px; }
  .eur-line { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--separator); }
  .eur-line:last-child { border-bottom: none; }
  .eur-line.total { border-top: 1px solid rgba(255,255,255,0.2); border-bottom: none; padding-top: 16px; margin-top: 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .eur-line.section-header-line { color: var(--text-tertiary); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: none; padding-bottom: 4px; font-weight: 500; }
  .eur-section { margin-bottom: 20px; }
  .eur-categories { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 16px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.06); }
  .eur-cat-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; color: var(--text-secondary); border-bottom: 1px solid var(--separator); }
  .eur-cat-item:last-child { border-bottom: none; }
  .eur-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .eur-controls select {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
    font-family: inherit;
  }
  .eur-override-panel {
    background: rgba(255,159,10,0.06);
    border: 1px solid rgba(255,159,10,0.2);
    border-radius: 12px;
    padding: 16px 20px;
    margin-top: 20px;
  }
  .eur-override-panel h4 { font-size: 13px; font-weight: 600; color: var(--orange); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .eur-override-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .eur-override-row label { font-size: 13px; color: var(--text-secondary); min-width: 190px; }
  .eur-override-input {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    padding: 7px 10px;
    width: 130px;
    outline: none;
    font-family: inherit;
  }
  .eur-override-input:focus { border-color: var(--orange); }

  /* ── Offene Posten ───────────────────────────────────── */
  .op-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    overflow: hidden;
    overflow-x: auto;
    margin-bottom: 20px;
  }
  .op-section-title {
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-bottom: 1px solid var(--separator);
  }
  .days-overdue { font-weight: 600; font-variant-numeric: tabular-nums; }
  .days-overdue.overdue  { color: var(--red); }
  .days-overdue.due-soon { color: var(--yellow); }
  .days-overdue.fine     { color: var(--green); }

  /* ── Kontenübersicht ──────────────────────────────────── */
  .konto-row td:nth-child(1) {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--teal);
  }

  /* ── Mahnungen ───────────────────────────────────────── */
  .mahnung-print { display: none; }
  @media print {
    body { background: white; color: black; }
    .app-layout, header { display: none !important; }
    .mahnung-print { display: block !important; }
    .eur-container { background: white; border: none; color: black; }
  }
  .mahnung-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .mahnung-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }

function loadState() {
  try {
    const saved = localStorage.getItem('leolan_buch_v5');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.version >= DATA_VERSION) {
        return { ...DEFAULT_STATE, ...parsed };
      }
    }
  } catch(e) {}
  // Neue Instanz → DEFAULT_STATE laden
  localStorage.removeItem('leolan_buch_v5');
  localStorage.removeItem('leolan_buch_v4');
  localStorage.removeItem('leolan_buch_v3');
  return { ...DEFAULT_STATE };
}

function saveState() {
  state.version = DATA_VERSION;
  localStorage.setItem('leolan_buch_v5', JSON.stringify(state));
}

function getUsdRate() {
  const r = parseFloat(document.getElementById('s-usd-rate')?.value);
  return (r && r > 0) ? r : (state.settings.usdRate || DEFAULT_USD_RATE);
}

function eurAmt(e) {
  if (e.amount_eur !== null && e.amount_eur !== undefined) return e.amount_eur;
  if (e.amount_usd !== null && e.amount_usd !== undefined) return e.amount_usd * getUsdRate();
  return null;
}

function fmtE(v) {
  if (v === null || v === undefined) return '<span class="text-muted">—</span>';
  return '€' + v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtOrig(e) {
  if (e.amount_usd !== null && e.amount_usd !== undefined)
    return '<span style="color:var(--orange)">$'+e.amount_usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'</span>';
  if (e.amount_eur !== null && e.amount_eur !== undefined)
    return fmtE(e.amount_eur);
  return '<span class="text-muted">n/a</span>';
}

function catBadge(c) {
  const m={'Software/API':'blue','Software/SaaS':'blue','Entwicklung':'purple',
    'Behörden/Beratung':'yellow','Behörden':'yellow','Rechtskosten':'red',
    'Webentwicklung':'green','App-Entwicklung':'green','Beratung':'yellow',
    'Marketing':'blue','KI/Automatisierung':'blue','Büro':'gray','Reise':'purple',
    'Telefon/Internet':'gray','Sonstiges':'gray'};
  return `<span class="badge badge-${m[c]||'gray'}">${esc(c)}</span>`;
}

function kontoBadge(kto) {
  if (!kto) return '<span class="text-muted">—</span>';
  return `<span class="badge badge-konto">${esc(kto)}</span>`;
}

function stkBadge(stk) {
  if (!stk) return '<span class="text-muted">—</span>';
  const cls = stk==='VSt 19%'?'vst19':stk==='VSt 7%'?'vst7':stk==='VSt 0%'?'vst0':'frei';
  return `<span class="badge badge-stk-${cls}">${esc(stk)}</span>`;
}

function statusBadge(s) {
  const m = {bezahlt:'green',offen:'yellow',überfällig:'red',storniert:'gray'};
  return `<span class="badge badge-${m[s]||'gray'}">${esc(s||'offen')}</span>`;
}

function getKonto(cat) {

}
